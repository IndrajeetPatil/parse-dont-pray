[project]
name = "parse-dont-pray"
version = "1.0.0"
description = "A presentation exploring the benefits of data validation libraries like Pydantic and Zod"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "CC0 1.0 Universal" }
authors = [
    { name = "Indrajeet Patil", email = "patilindrajeet.science@gmail.com" }
]
keywords = [
    "data-validation",
    "pydantic",
    "zod",
    "python",
    "typescript",
    "software-engineering",
    "type-safety",
    "llms-txt"
]
dependencies = ["ipykernel>=7.4.0", "nbclient>=0.11.0", "pyyaml>=6.0.3"]

[tool.uv]
required-version = ">=0.12.17"

